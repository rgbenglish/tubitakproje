            preQuestionsContainer.innerHTML = '';

                const qBox = document.createElement('div');
                qBox.className = 'pre-question-box';
                
                let optionsHTML = '';
                pq.o.forEach((option, oIndex) => {
                    optionsHTML += `<li onclick="checkPreAnswer(this, ${oIndex}, ${pq.a}, ${pqIndex})">${option}</li>`;

                qBox.innerHTML = `

                    <div class="pre-question-text">${pq.q}</div>
                    <ul class="pre-options" id="pre-options-${pqIndex}">

                opt.style.backgroundColor = 'white';
                opt.style.borderColor = '#ced4da';
                opt.innerText = opt.innerText.replace(" ✅", "").replace(" ❌", "");
            });

            if (selected === correct) {
                element.style.backgroundColor = '#d4edda';
                element.style.borderColor = '#28a745';
                element.innerText += " ✅ Correct!";
            } else {
                element.style.backgroundColor = '#f8d7da';
                element.style.borderColor = '#dc3545';
                element.innerText += " ❌ Not quite!";
            }

            // Bu soruyu cevaplandı olarak işaretle
            element.classList.add('answered');
            
            // Sadece doğru cevaplananları değil, herhangi bir cevap verilenleri say
            // Aynı soruya tekrar tıklanmasını engellemek için bir kontrol yapalım
            // (Yukarıda element.classList.contains('answered') ile yaptık ama bu sadece tıklanan element için)
            // Daha güvenli yol: Her sorunun cevaplanıp cevaplanmadığını ayrı takip etmek.
            // Şimdilik basitçe, her tıklamada buton kontrolü yapalım.
            // Ancak aynı soruya birden fazla tıklanırsa sayaç artmasın.
            // Bunun için her soru kutusuna bir 'data-answered' ekleyebiliriz veya global bir dizi kullanabiliriz.
            // En temizi: Her soru için bir flag.
            
            // Bu fonksiyon her tıklandığında çalıştığı için, sadece ilk tıklamada sayacı artırmalıyız.
            // Elementin parent'ı olan qBox'a bir özellik ekleyelim.
            const qBox = element.closest('.pre-question-box');
            if (!qBox.dataset.answered) {
                qBox.dataset.answered = "true";
                answeredPreQuestions++;
            }

            // 3 soru da cevaplandıysa butonu göster
            if (answeredPreQuestions === 3) {
                document.getElementById('btn-show-info').style.display = 'block';
            }
        }

        // Adımlar Arası Geçiş
        function goToStep(stepName) {
            document.getElementById('step-pre-question').classList.remove('active');
            document.getElementById('step-information').classList.remove('active');
            document.getElementById('step-quiz').classList.remove('active');

            document.getElementById(`step-${stepName}`).classList.add('active');
            modalContainer.scrollTop = 0;

            if (stepName === 'information' && currentCity) {
                document.getElementById('city-history').innerText = currentCity.history;
                document.getElementById('city-food').innerText = currentCity.food;
                document.getElementById('city-tourist').innerText = currentCity.tourist;
            }

            if (stepName === 'quiz' && currentCity) {
                renderQuiz(currentCity);
            }
        }

        // Quiz Sorularını Oluştur
        function renderQuiz(city) {
            const questionsContainer = document.getElementById('questions-container');
            questionsContainer.innerHTML = ''; 
            
            city.questions.forEach((qData, qIndex) => {
                const qBox = document.createElement('div');
                qBox.className = 'question-box';
                
                let qIcon = "❓";
                if(qData.topic === "History") qIcon = "🏛️";
                if(qData.topic === "Food") qIcon = "🍽️";
                if(qData.topic === "Tourist") qIcon = "🗺️";

                let optionsHTML = '';
                qData.o.forEach((option, oIndex) => {
                    optionsHTML += `<li onclick="checkQuizAnswer(this, ${oIndex}, ${qData.a}, ${qIndex})">${option}</li>`;
                });

                qBox.innerHTML = `
                    <h3>${qIcon} ${qData.topic} Quiz</h3>
                    <div class="question-text">${qData.q}</div>
                    <ul class="options" id="options-${qIndex}">
                        ${optionsHTML}
                    </ul>
                `;
                questionsContainer.appendChild(qBox);
            });
        }

        // Quiz Cevap Kontrolü
        function checkQuizAnswer(element, selected, correct, qIndex) {
            const questionOptions = document.querySelectorAll(`#options-${qIndex} li`);
            questionOptions.forEach(opt => {
                opt.style.backgroundColor = '#f8f9fa'; 
                opt.style.borderColor = '#ced4da';
                opt.innerText = opt.innerText.replace(" ✅", "").replace(" ❌", "");
            });

            if (selected === correct) {
                element.style.backgroundColor = '#d4edda';
                element.style.borderColor = '#28a745';
                element.innerText += " ✅ Correct!";
            } else {
                element.style.backgroundColor = '#f8d7da';
                element.style.borderColor = '#dc3545';
                element.innerText += " ❌ Try again!";
            }
        }

        // Haritaya Geri Dön
        function backToMap() {
            iconBoard.style.display = 'grid';
            modalContainer.style.display = 'none';
            backBtn.style.display = 'none';
            currentCity = null;
            answeredPreQuestions = 0;
        }

        // Tam Ekran
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // Başlat
        buildBoard();
    </script>
</body>
</html>
